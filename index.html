<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Primary Meta Tags -->
    <title>גלעד קילון | ייעוץ ארגוני, פיתוח מנהלים וצוותי הנהלה</title>
    <meta name="title" content="גלעד קילון | ייעוץ ארגוני, פיתוח מנהלים וצוותי הנהלה">
    <meta name="description"
        content="גלעד קילון - ייעוץ ארגוני ופיתוח מנהלים. מומחה בליווי צוותי הנהלה, פיתוח צוותים, עבודת ממשקים ובניית שותפויות לשיפור התקשורת הבין-אישית והצמיחה העסקית.">


    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kilon-consulting.com/">
    <meta property="og:title" content="גלעד קילון | ייעוץ ארגוני, פיתוח מנהלים וצוותי הנהלה">
    <meta property="og:description"
        content="גלעד קילון - ייעוץ ארגוני ופיתוח מנהלים. מומחה בליווי צוותי הנהלה, פיתוח צוותים, עבודת ממשקים ובניית שותפויות לשיפור התקשורת הבין-אישית והצמיחה העסקית.">
    <meta property="og:image" content="https://kilon.org/profile.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-dark': '#0a0a0a',
                        'brand-beige': '#f8f6f1',
                        'brand-accent': '#4a6fa5',
                        'brand-muted': '#6b7280',
                        'brand-gold': '#b8956e',
                        'brand-sage': '#8fa38f',
                        'brand-navy': '#1a222e',
                        'brand-paper': '#ffffff',
                        'brand-touch': '#e55d2b',
                    },
                    fontFamily: {
                        sans: ['Assistant', 'sans-serif'],
                    },
                    animation: {
                        'fadeIn': 'fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'slideUp': 'slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background: #f4f3ef;
            color: #111111;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Strategic Grid Background */
        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(17, 17, 17, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(17, 17, 17, 0.05) 1px, transparent 1px);
        }

        /* Architectural Card */
        .arch-card {
            background: #ffffff;
            border: 1px solid rgba(17, 17, 17, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .arch-card:hover {
            border-color: #111111;
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
        }

        .text-kern-tight {
            letter-spacing: -0.03em;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #111111;
            border-radius: 3px;
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #f8f6f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e55d2b;
            border-top: 4px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 700;
            color: #4a6fa5;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">טוען...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
        // Hide loading screen when React app mounts
        window.addEventListener('load', () => {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 0.5s ease';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }
        });
    </script>
</body>

</html>
