[[redirects]]
  from = "/360"
  to = "https://ubiquitous-nougat-41808d.netlify.app"
  status = 301
  force = true

# Handle article detail pages with function
[[redirects]]
  from = "/article_detail/:id"
  to = "/.netlify/functions/article-ssr/:id"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"