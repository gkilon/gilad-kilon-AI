[[redirects]]
  from = "/360"
  to = "https://ubiquitous-nougat-41808d.netlify.app"
  status = 301
  force = true

# Route all article_detail requests to SSR function (it will check User-Agent internally)
[[redirects]]
  from = "/article_detail/*"
  to = "/.netlify/functions/article-ssr/:splat"
  status = 200
  force = true

[functions]
  included_files = ["dist/index.html"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"