[[redirects]]
  from = "/360"
  to = "https://ubiquitous-nougat-41808d.netlify.app"
  status = 301
  force = true

# Route article_detail requests from social media bots to SSR function
[[redirects]]
  from = "/article_detail/*"
  to = "/.netlify/functions/article-ssr/:splat"
  status = 200
  force = true
  conditions = {User-Agent = ["*facebookexternalhit*", "*WhatsApp*", "*LinkedInBot*", "*Twitterbot*", "*Slackbot*", "*Googlebot*", "*Bingbot*", "*TelegramBot*"]}

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"